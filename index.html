<html lang="es" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Mis Finanzas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B4BFF'/%3E%3Cstop offset='1' stop-color='%23A25CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle'%3E💰%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
/* ==========================================================================
   MIS FINANZAS · sistema de diseño
   ========================================================================== */
:root{
  --bg:#F3F4FB; --surface:#FFFFFF; --surface-2:#F6F7FC; --text:#12163A; --muted:#7A809D; --line:#E7E9F5;
  --brand:#5B4BFF; --brand-2:#A25CFF; --brand-soft:#EEECFF;
  --inc:#0FB57F; --inc-soft:#DDF7EC; --exp:#F2455F; --exp-soft:#FFE7EB;
  --tr:#3B82F6; --tr-soft:#E4EEFF; --loan:#E8890C; --loan-soft:#FFF0D4; --vio:#8B5CF6; --vio-soft:#EEE8FF;
  --radius:24px; --radius-sm:16px;
  --shadow:0 1px 2px rgba(18,22,58,.04),0 12px 32px -14px rgba(18,22,58,.16);
  --shadow-lg:0 30px 70px -24px rgba(18,22,58,.45);
  --dock-h:76px; --side-w:252px;
}
[data-bs-theme=dark]{
  --bg:#0B0D1F; --surface:#151830; --surface-2:#1B1F3F; --text:#EEF0FF; --muted:#8E94B8; --line:#252A4D;
  --brand:#7F70FF; --brand-soft:#26245C;
  --inc:#2DD4A0; --inc-soft:#12382F; --exp:#FF6B81; --exp-soft:#3E1B28;
  --tr:#6BA3FF; --tr-soft:#1B2D55; --loan:#FBB13C; --loan-soft:#3B2E12; --vio:#A78BFA; --vio-soft:#2C2559;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:380px;z-index:0;pointer-events:none;
  background:radial-gradient(55% 100% at 15% 0%,rgba(124,92,255,.20),transparent 70%),radial-gradient(45% 90% at 95% 0%,rgba(16,181,127,.13),transparent 70%)}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,h5{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
.amt,.num{font-variant-numeric:tabular-nums}
body.hide .amt{filter:blur(9px);user-select:none;transition:filter .2s}
.muted{color:var(--muted)} .small{font-size:.82rem} .xs{font-size:.74rem}
.inc{color:var(--inc)} .exp{color:var(--exp)} .tr{color:var(--tr)} .loan{color:var(--loan)} .vio{color:var(--vio)}
.fw8{font-weight:800} .fw7{font-weight:700} .fw6{font-weight:600}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.main{padding:0 16px calc(var(--dock-h) + 38px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 2px 12px;margin:0 -2px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.topbar h1{font-size:1.55rem}
.topbar .sub{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:1px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  display:grid;place-items:center;font-size:1.05rem;box-shadow:var(--shadow);transition:transform .15s,background .2s;position:relative;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.sync-dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--inc);border:2px solid var(--surface)}
.sync-dot.saving{background:#F59E0B;animation:pulse 1s infinite}.sync-dot.error{background:var(--exp)}
@keyframes pulse{50%{opacity:.35}}
.view{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid-2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid-auto{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:10px 4px 0}
.sec-t h3{font-size:1.02rem}
.link{background:none;border:0;color:var(--brand);font-weight:700;font-size:.85rem;padding:4px 6px}

/* ---------- dock / sidebar ---------- */
.dock{position:fixed;z-index:40;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:var(--dock-h);
  display:flex;align-items:center;justify-content:space-around;padding:8px;border-radius:28px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:var(--shadow-lg)}
.dock .brand{display:none}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);
  font-size:.68rem;font-weight:700;padding:8px 2px;border-radius:20px;transition:color .2s,background .2s}
.nav-i i{font-size:1.3rem;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav-i.on{color:var(--brand);background:var(--brand-soft)}.nav-i.on i{transform:translateY(-1px) scale(1.12)}
.fab{position:fixed;z-index:41;right:20px;bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:22px;color:#fff;
  font-size:1.7rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 14px 30px -8px color-mix(in srgb,var(--brand) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.side-extra{display:none}
@media(min-width:992px){
  .main{max-width:1040px;margin-left:calc(var(--side-w) + (100vw - var(--side-w) - 1040px)/2);margin-right:auto;padding-bottom:60px}
  .dock{left:16px;top:16px;bottom:16px;right:auto;width:calc(var(--side-w) - 24px);height:auto;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 12px;border-radius:28px}
  .dock .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
  .brand-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));font-size:1.15rem}
  .nav-i{flex:none;flex-direction:row;gap:12px;font-size:.95rem;padding:12px 14px;border-radius:16px;justify-content:flex-start}
  .nav-i i{font-size:1.2rem}.side-extra{display:flex;margin-top:auto}
  .fab{right:36px;bottom:36px}
  .grid-3d{grid-template-columns:repeat(3,1fr)!important}
}
@media(max-width:380px){.grid-2.keep{grid-template-columns:1fr}}

/* ---------- tarjetas ---------- */
.card-x{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card-x.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h4{font-size:1rem}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px 18px;color:#fff;
  background:linear-gradient(135deg,#4B3DF5 0%,#7A4BFF 55%,#C040E8 100%);box-shadow:0 24px 50px -22px rgba(91,75,255,.8)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:260px;height:260px;right:-80px;top:-110px;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent)}
.hero::after{width:220px;height:220px;left:-70px;bottom:-120px;background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent)}
.hero>*{position:relative;z-index:1}
.hero.h-loan{background:linear-gradient(135deg,#7C3AED 0%,#C026D3 60%,#F43F5E 115%);box-shadow:0 24px 50px -22px rgba(192,38,211,.7)}
.hero.h-serv{background:linear-gradient(135deg,#0284C7 0%,#0EA5A4 60%,#10B981 115%);box-shadow:0 24px 50px -22px rgba(2,132,199,.7)}
.hero.h-save{background:linear-gradient(135deg,#059669 0%,#0D9488 55%,#0EA5E9 115%);box-shadow:0 24px 50px -22px rgba(5,150,105,.7)}
.hero-l{font-size:.8rem;font-weight:700;opacity:.85;letter-spacing:.02em}
.hero-amt{font-size:clamp(2rem,9vw,2.8rem);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:4px 0 2px}
.hero-sub{font-size:.8rem;opacity:.85;font-weight:600}
.hero-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.glass{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:10px 11px;min-width:0}
.glass span{display:block;font-size:.68rem;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glass b{display:block;font-size:clamp(.8rem,3.5vw,.95rem);font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.glass.warn{background:rgba(255,80,100,.35)}
.btn-glass{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;backdrop-filter:blur(8px)}

/* ---------- navegación de mes, segmentos, chips ---------- */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:var(--shadow)}
.monthnav .icon-btn{box-shadow:none;border-color:transparent;background:var(--surface-2);width:38px;height:38px;border-radius:14px}
.monthnav-t{flex:1;border:0;background:none;color:var(--text);font-weight:800;font-size:1rem;letter-spacing:-.01em}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:18px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;font-size:.86rem;padding:10px 6px;border-radius:14px;transition:all .2s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 10px rgba(18,22,58,.1)}
.seg button .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:10px;font-size:.7rem;background:var(--brand-soft);color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:700;transition:all .2s}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--inc-soft);color:var(--inc)}.pill.bad{background:var(--exp-soft);color:var(--exp)}
.pill.warn{background:var(--loan-soft);color:var(--loan)}.pill.info{background:var(--tr-soft);color:var(--tr)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.search{position:relative}.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px!important}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px 12px;box-shadow:var(--shadow);min-width:0}
.kpi-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.95rem;margin-bottom:9px}
.kpi-ico.inc{background:var(--inc-soft);color:var(--inc)}.kpi-ico.exp{background:var(--exp-soft);color:var(--exp)}.kpi-ico.brand{background:var(--brand-soft);color:var(--brand)}
.kpi-ico.loan{background:var(--loan-soft);color:var(--loan)}.kpi-ico.tr{background:var(--tr-soft);color:var(--tr)}.kpi-ico.vio{background:var(--vio-soft);color:var(--vio)}
.kpi-l{font-size:.72rem;font-weight:700;color:var(--muted)}
.kpi-v{font-size:clamp(.9rem,4vw,1.02rem);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-s{font-size:.68rem;font-weight:700;margin-top:2px;color:var(--muted);line-height:1.25}
.delta{font-weight:800}.delta.up{color:var(--exp)}.delta.down{color:var(--inc)}
.tile{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);color:var(--text);position:relative}
.tile .t-l{font-size:.75rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .t-v{font-size:1.3rem;font-weight:800;letter-spacing:-.025em;margin:5px 0 2px}
.tile .t-s{font-size:.74rem;color:var(--muted);font-weight:600}
.tile .go{position:absolute;right:14px;top:14px;color:var(--muted)}
.tile .dot{position:absolute;right:14px;bottom:14px;width:9px;height:9px;border-radius:50%;background:var(--exp);box-shadow:0 0 0 4px var(--exp-soft)}

/* ---------- gráficos ---------- */
.donut-wrap{position:relative;height:210px;margin:0 auto 10px;max-width:260px}
.chart-wrap{position:relative;height:200px}
.catlist{display:grid;gap:12px;margin-top:6px}
.catrow{display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;background:none;border:0;padding:0;text-align:left;color:var(--text);width:100%}
.catrow .ico{grid-row:span 2}
.catrow .nm{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .vl{font-weight:800;font-size:.9rem;text-align:right}
.catrow .pc{font-size:.72rem;color:var(--muted);font-weight:700;text-align:left;grid-column:2/4}
.catrow .bar{grid-column:2/4;margin-top:4px}
.bar{height:7px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--c,var(--brand));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.mini-stats div{min-width:0}.mini-stats small{display:block;font-size:.68rem;color:var(--muted);font-weight:700}.mini-stats b{font-size:.88rem;white-space:nowrap}

/* ---------- filas / listas ---------- */
.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:1.3rem;flex:none;
  background:color-mix(in srgb,var(--c,var(--brand)) 15%,var(--surface));color:var(--c,var(--brand))}
.ico.sm{width:38px;height:38px;border-radius:13px;font-size:1.1rem}
.ico.round{border-radius:50%}
.rowx{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;background:none;border:0;color:var(--text);transition:background .15s}
.rowx:active{background:var(--surface-2)}
.rowx+.rowx{border-top:1px solid var(--line)}
.rowx .mid{flex:1;min-width:0}
.rowx .t{font-weight:700;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx .s{font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx .r{text-align:right;flex:none}
.rowx .r b{display:block;font-size:.95rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.rowx .r small{font-size:.7rem;font-weight:700;color:var(--muted)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.day+.day{margin-top:12px}
.day-h{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.day-n{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.day-m{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--muted);font-weight:700}
.day-tot{margin-left:auto;text-align:right;font-size:.78rem;font-weight:800;line-height:1.3}
.grp-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:0;background:var(--surface-2);color:var(--text);text-align:left}
.grp-h .nm{font-weight:800;flex:1}.grp-h .caret{transition:transform .25s;color:var(--muted)}
.grp-h.closed .caret{transform:rotate(-90deg)}
.grp-b{display:grid}
.empty{text-align:center;padding:34px 20px}
.empty-e{font-size:2.6rem;margin-bottom:6px}
.empty h4{font-size:1.05rem;margin-bottom:4px}.empty p{color:var(--muted);font-size:.88rem;margin:0 auto 14px;max-width:290px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.person+.person{margin-top:12px}
.person-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface-2)}
.person-h .nm{font-weight:800;flex:1;min-width:0}.person-h .nm small{display:block;color:var(--muted);font-weight:600;font-size:.74rem}
.deuda{padding:13px 16px;display:grid;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--text)}
.deuda+.deuda{border-top:1px solid var(--line)}
.deuda .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.deuda .top b{font-size:1rem;font-weight:800;white-space:nowrap}
.deuda .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-sm-x{border:0;border-radius:12px;padding:8px 14px;font-weight:800;font-size:.8rem;background:var(--brand-soft);color:var(--brand)}
.btn-sm-x.ok{background:var(--inc-soft);color:var(--inc)}
.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:20px;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.notice{display:flex;gap:10px;align-items:center;background:var(--loan-soft);color:var(--loan);padding:10px 14px;border-radius:16px;font-size:.8rem;font-weight:700}
.timeline{display:grid;gap:0}
.tl{display:flex;gap:12px;align-items:center;padding:10px 0}.tl+.tl{border-top:1px dashed var(--line)}
.tl .mid{flex:1;min-width:0}.tl .t{font-weight:700;font-size:.88rem}.tl .s{font-size:.74rem;color:var(--muted);font-weight:600}

/* ---------- botones y formularios ---------- */
.btn-x{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 20px;font-weight:800;font-size:.95rem;
  color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 10px 24px -10px color-mix(in srgb,var(--brand) 80%,transparent);transition:transform .15s,opacity .2s}
.btn-x:active{transform:scale(.97)}.btn-x:disabled{opacity:.55}
.btn-x.soft{background:var(--brand-soft);color:var(--brand);box-shadow:none}
.btn-x.line{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn-x.danger{background:var(--exp-soft);color:var(--exp);box-shadow:none}
.btn-x.block{width:100%}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbzsRsrksxa6Is0M3VBcFuIU2mlosiI3NXfDk8KDZL9JqtXqeRPDeSgMGXghEfHUd-CC/exec';            // ← PEGA AQUÍ la URL de tu Web App de Apps Script (termina en /exec)

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const parseMonto = v => {
  let s = String(v ?? '').trim().replace(/\s/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, ''); else s = s.replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
};
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const SYM = { PEN: 'S/', USD: 'US$' };
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoy = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const ym = s => s.slice(0, 7);
const addMonth = (m, n) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysInMonth = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const monthLabel = m => { const [y, mm] = m.split('-').map(Number); return `${MESES[mm - 1]} ${y}`; };
const fechaCorta = s => { if (!s) return ''; const d = parseD(s); return `${pad(d.getDate())} ${MESES_C[d.getMonth()]}`; };
const fechaLarga = s => { if (!s) return ''; const d = parseD(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES_C[d.getMonth()]} ${d.getFullYear()}`; };
const money = (n, cur = 'PEN') => {
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `${n < -0.004 ? '−' : ''}${SYM[cur] || cur} ${s}`;
};
const moneyAbs = (n, cur = 'PEN') => money(Math.abs(n), cur);
/** versión compacta: sin decimales cuando el monto es de 1,000 o más (para tarjetas pequeñas) */
const moneyR = (n, cur = 'PEN') => {
  if (Math.abs(n) < 1000) return money(n, cur);
  const s = Math.abs(Math.round(n)).toLocaleString('en-US');
  return `${n < 0 ? '−' : ''}${SYM[cur] || cur} ${s}`;
};
/** {PEN,USD} → "S/ 100.00" (+ " · US$ 5.00" si hay dólares) */
const dual = (o, signo = '') => {
  const p = o.PEN || 0, u = o.USD || 0, out = [];
  if (p || !u) out.push(signo + money(p, 'PEN'));
  if (u) out.push(signo + money(u, 'USD'));
  return out.join(' · ');
};
const dualHero = o => { const p = o.PEN || 0, u = o.USD || 0; return (p || !u ? money(p) : '') + (u ? `<span style="display:block;font-size:.55em;opacity:.9;margin-top:2px">${p ? '＋ ' : ''}${money(u, 'USD')}</span>` : ''); };
const hashColor = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return PALETA[Math.abs(h) % PALETA.length]; };
const PALETA = ['#F97316', '#EF4444', '#EC4899', '#A855F7', '#6366F1', '#3B82F6', '#06B6D4', '#10B981', '#84CC16', '#EAB308', '#F59E0B', '#64748B'];
const EMOJIS = ['🍜', '🍔', '🍕', '☕', '🛒', '🚌', '🚗', '⛽', '🏠', '💡', '📱', '💊', '🩺', '📚', '🎓', '🎬', '🎮', '🎧', '🛍️', '👕', '👟', '🎁', '✈️', '🏖️', '🐶', '🐱', '💇', '🧴', '🧾', '💳', '💰', '📈', '🏷️', '🎉', '🔧', '🧹', '👶', '🍼', '⚽', '🏋️', '☎️', '📺', '🎂', '➕', '📦', '🏦', '🐷', '💵', '👜'];
const SISTEMA = ['g_otros', 'i_otros', 'i_servicios', 'i_intereses'];

/* ---------- estado ---------- */
const S = {
  token: '', v: 0, cargado: false, lastLoad: 0,
  data: { grupos: [], cuentas: [], categorias: [], movimientos: [], prestamos: [], servicios: [] },
  view: 'inicio', mes: ym(hoy()),
  filtro: 'todo', q: '', cat: '',
  cuentasTab: 'cuentas', prestTab: 'me_deben', prestEstado: 'activos', servTab: 'pendientes', setTab: 'gasto',
  collapsed: {}
};
const HOJA = { Grupos: 'grupos', Cuentas: 'cuentas', Categorias: 'categorias', Movimientos: 'movimientos', Prestamos: 'prestamos', Servicios: 'servicios' };
const NUMS = {
  cuentas: ['saldo_inicial', 'trea', 'orden', 'archivada'], categorias: ['orden'], grupos: ['orden'],
  movimientos: ['monto', 'monto_destino'], prestamos: ['monto'], servicios: ['monto']
};
function normalizar(d) {
  const out = {};
  for (const k of Object.keys(S.data)) {
    out[k] = (d[k] || []).map(r => {
      const o = { ...r };
      for (const c of (NUMS[k] || [])) o[c] = (o[c] === '' || o[c] == null) ? '' : Number(o[c]);
      return o;
    });
  }
  return out;
}

/* ---------- acceso rápido ---------- */
const cuentaBy = id => S.data.cuentas.find(c => c.id === id);
const grupoBy = id => S.data.grupos.find(g => g.id === id);
const catBy = id => S.data.categorias.find(c => c.id === id);
const isArch = c => Number(c.archivada) === 1;
const curOf = id => cuentaBy(id)?.moneda || 'PEN';
const byOrden = (a, b) => (Number(a.orden) || 0) - (Number(b.orden) || 0);
const catsTipo = t => S.data.categorias.filter(c => c.tipo === t).sort(byOrden);
const catDefault = t => catBy(t === 'gasto' ? 'g_otros' : 'i_otros') || catsTipo(t)[0];
const _m = {};
const memo = (k, fn) => { const e = _m[k]; if (e && e.v === S.v) return e.r; const r = fn(); _m[k] = { v: S.v, r }; return r; };

/* ---------- tipos de movimiento ---------- */
const TIPOS = {
  gasto: { label: 'Gasto', cls: 'exp' }, ingreso: { label: 'Ingreso', cls: 'inc' },
  transferencia: { label: 'Transferencia', cls: 'tr' },
  prestamo_dado: { label: 'Préstamo otorgado', cls: 'loan' }, prestamo_cobro: { label: 'Cobro de préstamo', cls: 'loan' },
  deuda_recibida: { label: 'Préstamo recibido', cls: 'vio' }, deuda_pago: { label: 'Pago de deuda', cls: 'vio' }
};
const esPrest = t => t === 'prestamo_dado' || t === 'prestamo_cobro' || t === 'deuda_recibida' || t === 'deuda_pago';
function efectos(m) {
  const a = Number(m.monto) || 0;
  const b = (m.monto_destino === '' || m.monto_destino == null) ? a : Number(m.monto_destino);
  switch (m.tipo) {
    case 'ingreso': case 'prestamo_cobro': case 'deuda_recibida': return [[m.cuenta_id, a]];
    case 'gasto': case 'prestamo_dado': case 'deuda_pago': return [[m.cuenta_id, -a]];
    case 'transferencia': return [[m.cuenta_id, -a], [m.cuenta_destino_id, b]];
  }
  return [];
}

/* ---------- cálculos ---------- */
const saldos = () => memo('sal', () => {
  const m = new Map(S.data.cuentas.map(c => [c.id, Number(c.saldo_inicial) || 0]));
  for (const mv of S.data.movimientos) for (const [id, d] of efectos(mv)) if (m.has(id)) m.set(id, m.get(id) + d);
  return m;
});
const saldoDe = id => saldos().get(id) || 0;

/** resumen por moneda: disp (efectivo/cuentas), aho (ahorros), deuda (tarjetas) */
const resumen = () => memo('res', () => {
  const sal = saldos(), R = { PEN: { disp: 0, aho: 0, deuda: 0 }, USD: { disp: 0, aho: 0, deuda: 0 } };
  for (const c of S.data.cuentas) {
    if (isArch(c)) continue;
    const g = grupoBy(c.grupo_id) || { tipo: 'normal' }, cur = c.moneda || 'PEN', b = sal.get(c.id) || 0;
    if (g.tipo === 'credito') { if (b < 0) R[cur].deuda += -b; else R[cur].disp += b; }
    else if (g.tipo === 'ahorro') R[cur].aho += b;
    else R[cur].disp += b;
  }
  return R;
});
const netoDe = (R, cur) => R[cur].disp + R[cur].aho - R[cur].deuda;

const statsMes = m => memo('st' + m, () => {
  const o = { ing: { PEN: 0, USD: 0 }, gas: { PEN: 0, USD: 0 }, pre: { PEN: 0, USD: 0 }, cob: { PEN: 0, USD: 0 }, cat: {}, catUSD: {}, nGas: 0, mayor: null };
  for (const mv of S.data.movimientos) {
    if (ym(mv.fecha) !== m) continue;
    const cur = curOf(mv.cuenta_id), flujo = mv.ref_tipo !== 'ajuste';
    if (mv.tipo === 'ingreso' && flujo) o.ing[cur] += mv.monto;
    else if (mv.tipo === 'gasto' && flujo) {
      o.gas[cur] += mv.monto; o.nGas++;
      const bucket = cur === 'PEN' ? o.cat : o.catUSD;
      bucket[mv.categoria_id] = (bucket[mv.categoria_id] || 0) + mv.monto;
      if (cur === 'PEN' && (!o.mayor || mv.monto > o.mayor.monto)) o.mayor = mv;
    }
    else if (mv.tipo === 'prestamo_dado') o.pre[cur] += mv.monto;
    else if (mv.tipo === 'prestamo_cobro') o.cob[cur] += mv.monto;
  }
  return o;
});

/** capital neto (soles o dólares) a una fecha */
function netoAl(fecha, cur) {
  const ids = new Set(); let tot = 0;
  for (const c of S.data.cuentas) { if (isArch(c) || (c.moneda || 'PEN') !== cur) continue; ids.add(c.id); tot += Number(c.saldo_inicial) || 0; }
  for (const mv of S.data.movimientos) { if (mv.fecha > fecha) continue; for (const [id, d] of efectos(mv)) if (ids.has(id)) tot += d; }
  return tot;
}

/* préstamos */
const PREST = { me_deben: { ini: 'prestamo_dado', abo: 'prestamo_cobro' }, debo: { ini: 'deuda_recibida', abo: 'deuda_pago' } };
const prestMap = () => memo('pm', () => {
  const m = new Map();
  for (const p of S.data.prestamos) m.set(p.id, { p, abonos: [], pagado: 0 });
  for (const mv of S.data.movimientos) {
    if (mv.ref_tipo === 'prestamo' && (mv.tipo === 'prestamo_cobro' || mv.tipo === 'deuda_pago')) {
      const e = m.get(mv.ref_id); if (e) { e.abonos.push(mv); e.pagado += mv.monto; }
    }
  }
  const h = hoy();
  for (const e of m.values()) {
    e.abonos.sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.creado).localeCompare(String(b.creado)));
    e.pendiente = r2(e.p.monto - e.pagado);
    e.saldado = e.pendiente <= 0.004;
    e.dias = (!e.saldado && e.p.fecha_promesa) ? diffDays(e.p.fecha_promesa, h) : null;
    e.pct = Math.min(100, e.p.monto > 0 ? (e.pagado / e.p.monto) * 100 : 0);
  }
  return m;
});
const prestList = (dir) => [...prestMap().values()].filter(e => e.p.direccion === dir);
const prestTotales = dir => {
  const t = { PEN: 0, USD: 0 }; let n = 0, venc = 0; const personas = new Set();
  for (const e of prestList(dir)) { if (e.saldado) continue; t[e.p.moneda || 'PEN'] += e.pendiente; n++; personas.add(e.p.persona.trim().toLowerCase()); if (e.dias !== null && e.dias < 0) venc++; }
  return { t, n, venc, personas: personas.size };
};

/* servicios */
const servTotales = () => {
  const t = { PEN: 0, USD: 0 }; let n = 0, venc = 0; const h = hoy();
  const cobMes = { PEN: 0, USD: 0 };
  for (const s of S.data.servicios) {
    if (s.estado === 'cobrado') { if (s.fecha_cobro && ym(s.fecha_cobro) === ym(h)) cobMes[s.moneda || 'PEN'] += s.monto; continue; }
    t[s.moneda || 'PEN'] += s.monto; n++;
    if (s.fecha_estimada && s.fecha_estimada < h) venc++;
  }
  return { t, n, venc, cobMes };
};

/* rendimiento (TREA): interés diario = ((1+TREA)^(1/360) − 1) × saldo del día, redondeado a 2 decimales, abonado a fin de mes */
function interesMes(c, m) {
  const trea = Number(c.trea) || 0; if (trea <= 0) return null;
  const k = Math.pow(1 + trea / 100, 1 / 360) - 1, n = daysInMonth(m), ini = `${m}-01`;
  const evs = [];
  for (const mv of S.data.movimientos) for (const [id, d] of efectos(mv)) if (id === c.id) evs.push([mv.fecha, d]);
  evs.sort((a, b) => a[0].localeCompare(b[0]));
  let bal = Number(c.saldo_inicial) || 0, i = 0;
  while (i < evs.length && evs[i][0] < ini) bal += evs[i++][1];
  let total = 0;
  for (let d = 1; d <= n; d++) {
    const f = `${m}-${pad(d)}`;
    while (i < evs.length && evs[i][0] <= f) bal += evs[i++][1];
    total += r2(k * Math.max(bal, 0));
  }
  const real = S.data.movimientos.filter(mv => mv.ref_tipo === 'interes' && mv.ref_id === c.id && ym(mv.fecha) === m).reduce((a, b) => a + b.monto, 0);
  const saldo = saldoDe(c.id);
  return { trea, dias: n, diario: r2(k * Math.max(saldo, 0)), estimado: r2(total), real: r2(real), anual: r2(Math.max(saldo, 0) * trea / 100), saldo };
}

/* ---------- API ---------- */
let _queue = Promise.resolve(), _pending = 0;
async function callApi(action, payload = {}) {
  if (!API_URL) return { ok: false, error: 'SIN_API_URL' };
  const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action, token: S.token, ...payload }) });
  return r.json();
}
function applyLocal(ops) {
  for (const o of ops) {
    const arr = S.data[HOJA[o.hoja]];
    if (o.op === 'upsert') { const i = arr.findIndex(x => x.id === o.data.id); if (i >= 0) arr[i] = { ...arr[i], ...o.data }; else arr.push({ ...o.data }); }
    else if (o.op === 'delete') { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr.splice(i, 1); }
    else if (o.op === 'deleteWhere') { for (let i = arr.length - 1; i >= 0; i--) if (String(arr[i][o.campo]) === String(o.valor)) arr.splice(i, 1); }
  }
}
const up = (hoja, data) => ({ op: 'upsert', hoja, data });
const del = (hoja, id) => ({ op: 'delete', hoja, id });
const delWhere = (hoja, campo, valor) => ({ op: 'deleteWhere', hoja, campo, valor });

/** aplica al instante en pantalla y sincroniza con el Sheet en segundo plano */
function commit(ops, msg) {
  applyLocal(ops); S.v++; renderAll();
  setSync('saving'); _pending++;
  _queue = _queue.then(() => callApi('batch', { ops })).then(res => {
    if (!res || !res.ok) throw new Error((res && res.error) || 'Error');
    _pending--; setSync(_pending ? 'saving' : 'ok');
  }).catch(async err => {
    _pending--; setSync('error');
    if (['NO_AUTORIZADO', 'BLOQUEADO'].includes(err.message)) return logout();
    toast('No se pudo guardar: ' + err.message, 'danger');
    try { await cargar(true); renderAll(); } catch (e) { /* sin red */ }
  });
  if (msg) toast(msg);
  return _queue;
}
async function cargar() {
  const res = await callApi('getAll');
  if (!res || !res.ok) { const e = new Error((res && res.error) || 'ERROR'); e.res = res; throw e; }
  S.data = normalizar(res.data); S.v++; S.cargado = true; S.lastLoad = Date.now();
}

/* ---------- hojas modales ---------- */
const sheetStack = [];
function openSheet({ title = '', html = '', foot = '', cls = '', onMount, onClose } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap ' + cls;
  wrap.style.zIndex = 1000 + sheetStack.length * 10;
  wrap.innerHTML = `<div class="sheet-bg"></div><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h3>${title}</h3><button class="icon-btn" data-sheet-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div>
    <div class="sheet-body">${html}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
  $('#sheets').appendChild(wrap);
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('in')));
  const sh = {
    el: wrap, $: s => $(s, wrap), $$: s => $$(s, wrap),
    close() {
      const i = sheetStack.indexOf(sh); if (i < 0) return; sheetStack.splice(i, 1);
      wrap.classList.remove('in');
      setTimeout(() => wrap.remove(), 260);
      if (!sheetStack.length) document.body.classList.remove('noscroll');
      onClose && onClose();
    }
  };
  wrap.addEventListener('click', e => {
    if (e.target.classList.contains('sheet-bg') || e.target.closest('[data-sheet-close]')) sh.close();
  });
  sheetStack.push(sh);
  onMount && onMount(sh);
  return sh;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) sheetStack[sheetStack.length - 1].close(); });

function confirmBox({ title = '¿Seguro?', msg = '', ok = 'Confirmar', danger = false } = {}) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    openSheet({
      title, cls: 'sm', html: `<p style="margin:6px 0 4px">${msg}</p>`,
      foot: `<button class="btn-x line" data-no>Cancelar</button><button class="btn-x ${danger ? 'danger' : ''}" data-ok>${ok}</button>`,
      onClose: () => fin(false),
      onMount: sh => {
        sh.$('[data-no]').onclick = () => sh.close();
        sh.$('[data-ok]').onclick = () => { fin(true); sh.close(); };
      }
    });
  });
}

}

function listaMovs() {
  let L = S.data.movimientos.filter(m => ym(m.fecha) === S.mes);
  const f = S.filtro;
  if (f === 'gasto') L = L.filter(m => m.tipo === 'gasto');
  else if (f === 'ingreso') L = L.filter(m => m.tipo === 'ingreso');
  else if (f === 'transferencia') L = L.filter(m => m.tipo === 'transferencia');
  else if (f === 'prestamos') L = L.filter(m => esPrest(m.tipo));
  if (S.cat) L = L.filter(m => m.categoria_id === S.cat);
  const q = S.q.trim().toLowerCase();
  if (q) L = L.filter(m => [m.nota, catBy(m.categoria_id)?.nombre, cuentaBy(m.cuenta_id)?.nombre, cuentaBy(m.cuenta_destino_id)?.nombre, personaDe(m)].join(' ').toLowerCase().includes(q));
  if (!L.length) return `<div class="card-x">${empty('🔎', 'Nada por aquí', q || S.cat || f !== 'todo' ? 'No hay movimientos con ese filtro en este mes.' : 'No hay movimientos este mes. Toca ＋ para agregar uno.')}</div>`;
  const g = {}; for (const m of L) (g[m.fecha] ||= []).push(m);
  return Object.keys(g).sort().reverse().map(f => {
    const items = g[f].sort(sortMov), d = parseD(f), ing = { PEN: 0, USD: 0 }, gas = { PEN: 0, USD: 0 };
    for (const m of items) { if (m.ref_tipo === 'ajuste') continue; const c = curOf(m.cuenta_id); if (m.tipo === 'ingreso') ing[c] += m.monto; else if (m.tipo === 'gasto') gas[c] += m.monto; }
    const tot = [];
    if (ing.PEN) tot.push(`<span class="inc amt">＋${money(ing.PEN)}</span>`); if (ing.USD) tot.push(`<span class="inc amt">＋${money(ing.USD, 'USD')}</span>`);
    if (gas.PEN) tot.push(`<span class="exp amt">−${money(gas.PEN)}</span>`); if (gas.USD) tot.push(`<span class="exp amt">−${money(gas.USD, 'USD')}</span>`);
    return `<div class="day"><div class="day-h"><div class="day-n">${pad(d.getDate())}</div><div class="day-m"><span class="pill">${DIAS[d.getDay()]}</span><span>${pad(d.getMonth() + 1)}.${d.getFullYear()}</span></div><div class="day-tot">${tot.join('<br>')}</div></div>${items.map(m => movRow(m)).join('')}</div>`;
  }).join('');
}

function vRend() {

  if (!L.length) return `<div class="card-x">${empty('📈', 'Sin cuentas con rendimiento', 'Edita una cuenta de ahorro y escribe su TREA (4%, 4.5%, 5%…) para ver cuánto te pagarán a fin de mes.', '<button class="btn-x" data-act="newCuenta"><i class="bi bi-plus-lg"></i> Crear cuenta de ahorro</button>')}</div>`;
  const rows = L.map(c => ({ c, i: interesMes(c, m) })), tot = rows.reduce((a, x) => a + x.i.estimado, 0), real = rows.reduce((a, x) => a + x.i.real, 0), anual = rows.reduce((a, x) => a + x.i.anual, 0);
  const cards = rows.map(({ c, i }) => {

    <div class="mini-stats"><div><small>Saldo</small><b class="amt">${money(i.saldo, c.moneda)}</b></div><div><small>Por día</small><b class="amt">≈ ${money(i.diario, c.moneda)}</b></div><div><small>Fin de mes</small><b class="amt inc">＋${money(i.estimado, c.moneda)}</b></div></div>
    <div style="margin-top:14px">${i.real > 0 ? `<div style="display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:6px"><span class="muted">Recibido</span><span class="amt">${money(i.real, c.moneda)} <span class="${dif >= 0 ? 'inc' : 'exp'}">(${dif >= 0 ? '＋' : '−'}${money(Math.abs(dif), c.moneda)} vs estimado)</span></span></div><div class="bar" style="--c:var(--inc)"><i style="width:${pct}%"></i></div>`
      : `<button class="btn-x soft block" data-act="regInteres" data-id="${esc(c.id)}"><i class="bi bi-plus-circle"></i> Registrar interés recibido</button>`}</div>
    <div class="xs muted fw7" style="margin-top:10px;text-align:center">≈ ${money(i.anual, c.moneda)} al año con el saldo actual</div></div>`;
  }).join('');
  return `${monthNav()}
  <section class="hero h-save"><div class="hero-l">Intereses estimados · ${cap(monthLabel(m))}</div><div class="hero-amt amt">＋${money(tot)}</div><div class="hero-sub">Solo referencia: no se suma a tu saldo hasta que registres el pago real</div>
  <div class="hero-chips" style="grid-template-columns:1fr 1fr"><div class="glass"><span>Ya recibido</span><b class="amt">${money(real)}</b></div><div class="glass"><span>Al año (estimado)</span><b class="amt">${money(anual)}</b></div></div></section>

  ${segHTML([{ v: 'me_deben', t: 'Me deben', n: prestTotales('me_deben').n }, { v: 'debo', t: 'Yo debo', n: prestTotales('debo').n }], S.prestTab, 'prestTab')}

/* ---------- exportar CSV ---------- */
function descargarCSV(nombre, cols, rows) {
  const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = '﻿' + [cols.join(','), ...rows.map(r => r.map(q).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${nombre}_${hoy()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportar(que) {
  if (que === 'movimientos') descargarCSV('movimientos', ['Fecha', 'Tipo', 'Cuenta', 'Cuenta destino', 'Monto', 'Moneda', 'Categoría', 'Nota', 'Persona'],
    [...S.data.movimientos].sort(sortMov).map(m => [m.fecha, TIPOS[m.tipo]?.label || m.tipo, cuentaBy(m.cuenta_id)?.nombre, cuentaBy(m.cuenta_destino_id)?.nombre || '', m.monto, curOf(m.cuenta_id), catBy(m.categoria_id)?.nombre || '', m.nota, personaDe(m)]));
  if (que === 'prestamos') descargarCSV('prestamos', ['Tipo', 'Persona', 'Concepto', 'Monto', 'Pagado', 'Pendiente', 'Moneda', 'Fecha', 'Fecha promesa', 'Estado'],
    [...prestMap().values()].map(e => [e.p.direccion === 'me_deben' ? 'Me deben' : 'Yo debo', e.p.persona, e.p.concepto, e.p.monto, r2(e.pagado), e.pendiente, e.p.moneda, e.p.fecha, e.p.fecha_promesa, e.saldado ? 'Pagado' : 'Pendiente']));
  if (que === 'servicios') descargarCSV('servicios', ['Cliente', 'Servicio', 'Monto', 'Moneda', 'Fecha servicio', 'Fecha estimada', 'Estado', 'Fecha cobro', 'Cuenta'],
    S.data.servicios.map(s => [s.cliente, s.servicio, s.monto, s.moneda, s.fecha_servicio, s.fecha_estimada, s.estado, s.fecha_cobro, cuentaBy(s.cuenta_id)?.nombre || '']));
  if (que === 'cuentas') descargarCSV('cuentas', ['Grupo', 'Cuenta', 'Moneda', 'Saldo actual', 'TREA %'],
    S.data.cuentas.filter(c => !isArch(c)).map(c => [grupoBy(c.grupo_id)?.nombre, c.nombre, c.moneda, r2(saldoDe(c.id)), c.trea]));
  toast('Descarga lista');
}

/* =====================================================================
   MIS FINANZAS · formularios (hojas modales)
   ===================================================================== */
const nowISO = () => new Date().toISOString();
const lastCuenta = () => { const id = localStorage.getItem('fin_lastcuenta'); const c = id && cuentaBy(id); if (c && !isArch(c)) return c.id; return S.data.cuentas.find(c => !isArch(c))?.id || ''; };
const num = (sh, id) => parseMonto(sh.$('#' + id)?.value);
const val = (sh, id) => (sh.$('#' + id)?.value || '').trim();
function setCurLabels(sh, id, cur) { sh.$$(`[data-cur="${id}"]`).forEach(e => e.textContent = SYM[cur] || cur); }

/* ===================== MOVIMIENTO (gasto / ingreso / transferencia) ===================== */
function sheetMov(opts = {}) {
  if (!S.data.cuentas.some(c => !isArch(c))) { toast('Primero crea una cuenta', 'danger'); return sheetCuenta(); }
  const ed = opts.id ? S.data.movimientos.find(m => m.id === opts.id) : null;
  if (ed && ed.ref_tipo === 'prestamo') return sheetPrestDet(ed.ref_id);
  if (ed && ed.ref_tipo === 'servicio') return sheetServDet(ed.ref_id);
  const st = {
    tipo: ed?.tipo || opts.tipo || 'gasto', cat: ed?.categoria_id || '', cuenta: ed?.cuenta_id || opts.cuenta || lastCuenta(), dest: ed?.cuenta_destino_id || '',
    monto: ed ? String(ed.monto) : '', md: ed && ed.monto_destino !== '' ? String(ed.monto_destino) : '', fecha: ed?.fecha || hoy(), nota: ed?.nota || ''
  };
  let sh;
  const grab = () => { if (!sh.$('#f-fecha')) return; st.monto = val(sh, 'f-monto'); st.md = val(sh, 'f-md'); st.fecha = val(sh, 'f-fecha') || st.fecha; st.nota = val(sh, 'f-nota'); st.cuenta = val(sh, 'f-cuenta') || st.cuenta; st.dest = val(sh, 'f-dest') || st.dest; };
  const body = () => {
    const t = st.tipo, cur = curOf(st.cuenta);
    if (t === 'transferencia' && (!st.dest || st.dest === st.cuenta)) st.dest = S.data.cuentas.find(c => !isArch(c) && c.id !== st.cuenta)?.id || '';
    const curD = curOf(st.dest);
    if ((t === 'gasto' || t === 'ingreso') && st.cat && catBy(st.cat)?.tipo !== t) st.cat = '';
    const segs = [['gasto', 'Gasto'], ['ingreso', 'Ingreso'], ['transferencia', 'Transfer.'], ['prestamo', 'Préstamo']];
    return `<div class="seg" style="margin-bottom:16px">${segs.map(([v, n]) => `<button type="button" class="${v === t ? 'on' : ''}" data-tipo="${v}" ${ed && v === 'prestamo' ? 'disabled' : ''}>${n}</button>`).join('')}</div>
    ${F.field(t === 'transferencia' ? 'Monto que sale' : 'Monto', F.money('f-monto', cur, st.monto))}
    ${(t === 'gasto' || t === 'ingreso') ? F.field('Categoría', `<div class="catgrid">${catsTipo(t).map(c => `<button type="button" class="catbtn ${c.id === st.cat ? 'on' : ''}" style="--c:${esc(c.color)}" data-cat="${esc(c.id)}"><span class="e">${esc(c.icono)}</span><span>${esc(c.nombre)}</span></button>`).join('')}<button type="button" class="catbtn" data-newcat><span class="e">＋</span><span>Nueva</span></button></div>`) : ''}
    ${F.field(t === 'transferencia' ? 'Desde' : (t === 'gasto' ? 'Pagado con' : 'Entra a'), F.cuentas('f-cuenta', st.cuenta))}
    ${t === 'transferencia' ? F.field('Hacia', F.cuentas('f-dest', st.dest, { exclude: st.cuenta })) + (curD !== cur ? F.field('Monto que llega', F.money('f-md', curD, st.md), 'Las cuentas son de distinta moneda: escribe cuánto llegó realmente.') : '') : ''}
    ${F.field('Fecha', F.date('f-fecha', st.fecha))}
    ${F.field('Nota (opcional)', F.text('f-nota', st.nota, t === 'transferencia' ? 'Ej. Pago de tarjeta, ahorro del mes' : 'Ej. Almuerzo con el equipo'))}`;
  };
  const paint = () => { sh.body_.innerHTML = body(); wire(); };
  const wire = () => {
    sh.$$('[data-tipo]').forEach(b => b.onclick = () => {
      grab();
      if (b.dataset.tipo === 'prestamo') { sh.close(); return sheetPrestamo(); }
      st.tipo = b.dataset.tipo; st.cat = ''; paint();
    });
    sh.$$('[data-cat]').forEach(b => b.onclick = () => { st.cat = b.dataset.cat; sh.$$('[data-cat]').forEach(x => x.classList.toggle('on', x === b)); });
    const nb = sh.$('[data-newcat]'); if (nb) nb.onclick = () => { grab(); sheetCategoria({ tipo: st.tipo, onSaved: id => { st.cat = id; paint(); } }); };
    ['f-cuenta', 'f-dest'].forEach(id => { const e = sh.$('#' + id); if (e) e.onchange = () => { grab(); paint(); }; });
    const f = sh.$('#f-monto'); if (f) f.oninput = () => { f.value = f.value.replace(/[^0-9.,]/g, ''); };
  };
  sh = openSheet({
    title: ed ? 'Editar movimiento' : 'Nuevo movimiento', html: '<div id="mv-body"></div>',
    foot: `${ed ? '<button class="btn-x danger fit" data-del aria-label="Eliminar"><i class="bi bi-trash3"></i></button>' : ''}<button class="btn-x" data-save>${ed ? 'Guardar cambios' : 'Guardar'}</button>`,
    onMount: s => {
      sh = s; sh.body_ = sh.$('#mv-body'); bindDateChips(sh); paint();
      if (!ed) setTimeout(() => sh.$('#f-monto')?.focus(), 380);
      sh.$('[data-save]').onclick = () => {
        grab(); const t = st.tipo, monto = parseMonto(st.monto);
        if (!(monto > 0)) { toast('Escribe un monto mayor a 0', 'danger'); return sh.$('#f-monto').focus(); }
        if (!cuentaBy(st.cuenta)) return toast('Elige una cuenta', 'danger');
        let md = '';
        if (t === 'transferencia') {
          if (!cuentaBy(st.dest) || st.dest === st.cuenta) return toast('Elige una cuenta destino distinta', 'danger');
          if (curOf(st.dest) !== curOf(st.cuenta)) { md = parseMonto(st.md); if (!(md > 0)) { toast('Escribe el monto que llega', 'danger'); return sh.$('#f-md')?.focus(); } }
        }
        const cat = (t === 'gasto' || t === 'ingreso') ? (st.cat || catDefault(t)?.id || '') : '';
        const mv = { id: ed?.id || uid('m_'), fecha: st.fecha, tipo: t, cuenta_id: st.cuenta, cuenta_destino_id: t === 'transferencia' ? st.dest : '', monto, monto_destino: md, categoria_id: cat, nota: st.nota, ref_tipo: ed?.ref_tipo || '', ref_id: ed?.ref_id || '', creado: ed?.creado || nowISO() };
        localStorage.setItem('fin_lastcuenta', st.cuenta);
        sh.close(); commit([up('Movimientos', mv)], ed ? 'Cambios guardados' : { gasto: 'Gasto registrado', ingreso: 'Ingreso registrado', transferencia: 'Transferencia registrada' }[t]);
      };
      const d = sh.$('[data-del]'); if (d) d.onclick = async () => { if (await confirmBox({ title: 'Eliminar movimiento', msg: 'Se quitará y el saldo de la cuenta se recalculará.', ok: 'Eliminar', danger: true })) { sh.close(); commit([del('Movimientos', ed.id)], 'Movimiento eliminado'); } };
    }
  });
}

/* ===================== CUENTAS ===================== */
function sheetCuenta(opts = {}) {
  const ed = opts.id ? cuentaBy(opts.id) : null;
  const grupos = [...S.data.grupos].sort(byOrden);
  const g0 = ed?.grupo_id || opts.grupo || grupos[0]?.id;
  const isCr = gid => grupoBy(gid)?.tipo === 'credito';
  const saldoVal = ed ? String(isCr(ed.grupo_id) ? Math.abs(Number(ed.saldo_inicial) || 0) : Number(ed.saldo_inicial) || 0) : '';
  const sh = openSheet({
    title: ed ? 'Editar cuenta' : 'Nueva cuenta',
    html: `${F.field('Nombre', F.text('c-nombre', ed?.nombre || '', 'Ej. Interbank, Ahorro para casa'))}
    ${F.field('Grupo', F.select('c-grupo', grupos.map(g => ({ v: g.id, t: `${g.icono} ${g.nombre}` })), g0))}
    ${F.field('Moneda', F.select('c-mon', [{ v: 'PEN', t: 'S/ · Soles' }, { v: 'USD', t: 'US$ · Dólares' }], ed?.moneda || 'PEN'))}
    <div class="fld"><label id="c-lbl">${isCr(g0) ? 'Deuda actual (lo que debes)' : 'Saldo inicial (lo que tienes hoy)'}</label>${F.money('c-saldo', ed?.moneda || 'PEN', saldoVal)}${ed ? '<div class="hint">Cambiar esto modifica tu saldo actual. Para cuadrar con el banco usa “Ajustar saldo”.</div>' : ''}</div>
    <div id="c-trea-w">${F.field('TREA % (opcional)', F.text('c-trea', ed?.trea || '', 'Ej. 4.5', 'inputmode="decimal"'), 'Si la cuenta rinde, pon su TREA y verás el interés estimado de fin de mes.')}</div>`,
    foot: `${ed ? '<button class="btn-x danger fit" data-del aria-label="Eliminar"><i class="bi bi-trash3"></i></button>' : ''}<button class="btn-x" data-save>${ed ? 'Guardar' : 'Crear cuenta'}</button>`,
    onMount: sh => {
      const sync = () => { const cr = isCr(val(sh, 'c-grupo')); sh.$('#c-lbl').textContent = cr ? 'Deuda actual (lo que debes)' : 'Saldo inicial (lo que tienes hoy)'; sh.$('#c-trea-w').hidden = cr; setCurLabels(sh, 'c-saldo', val(sh, 'c-mon')); };
      sh.$('#c-grupo').onchange = sync; sh.$('#c-mon').onchange = sync; sync();
      if (!ed) setTimeout(() => sh.$('#c-nombre')?.focus(), 380);
      sh.$('[data-save]').onclick = () => {
        const nombre = val(sh, 'c-nombre'); if (!nombre) { toast('Ponle un nombre a la cuenta', 'danger'); return sh.$('#c-nombre').focus(); }
        const gid = val(sh, 'c-grupo'), cr = isCr(gid); let saldo = num(sh, 'c-saldo'); if (cr) saldo = -Math.abs(saldo);
        const trea = cr ? '' : parseMonto(val(sh, 'c-trea')) || '';
        const c = { id: ed?.id || uid('c_'), grupo_id: gid, nombre, moneda: val(sh, 'c-mon'), saldo_inicial: saldo, trea, orden: ed?.orden || (S.data.cuentas.filter(x => x.grupo_id === gid).length + 1), archivada: ed?.archivada || 0, creado: ed?.creado || nowISO() };
        sh.close(); commit([up('Cuentas', c)], ed ? 'Cuenta actualizada' : 'Cuenta creada');
      };
      const d = sh.$('[data-del]'); if (d) d.onclick = async () => {
        const usa = S.data.movimientos.some(m => m.cuenta_id === ed.id || m.cuenta_destino_id === ed.id);
        if (usa) { if (await confirmBox({ title: 'Archivar cuenta', msg: 'Tiene movimientos, así que se archivará: dejará de aparecer y de sumar en tus totales.', ok: 'Archivar' })) { sh.close(); commit([up('Cuentas', { id: ed.id, archivada: 1 })], 'Cuenta archivada'); } }

function sheetAjuste(id) {
  const c = cuentaBy(id), cr = grupoBy(c.grupo_id)?.tipo === 'credito', b = saldoDe(id);
  openSheet({
    title: 'Ajustar saldo',
    html: `<p class="muted fw6" style="margin:0 0 14px">Escribe cuánto ${cr ? 'debes realmente' : 'tienes realmente'} en <b style="color:var(--text)">${esc(c.nombre)}</b>. Se creará un ajuste (no cuenta como ingreso ni gasto).</p>
    ${F.field(cr ? 'Deuda real' : 'Saldo real', F.money('a-real', c.moneda, ''), `En la app figura: ${cr ? money(Math.max(0, -b), c.moneda) : money(b, c.moneda)}`)}`,
    foot: '<button class="btn-x" data-save>Aplicar ajuste</button>',

      setTimeout(() => sh.$('#a-real').focus(), 380);

        const raw = sh.$('#a-real').value.trim(); if (raw === '') return toast('Escribe el saldo real', 'danger');

        const dif = r2(real - b); if (Math.abs(dif) < 0.005) { sh.close(); return toast('El saldo ya coincide'); }
        const t = dif > 0 ? 'ingreso' : 'gasto';
        const mv = { id: uid('m_'), fecha: hoy(), tipo: t, cuenta_id: id, cuenta_destino_id: '', monto: Math.abs(dif), monto_destino: '', categoria_id: catDefault(t)?.id || '', nota: 'Ajuste de saldo', ref_tipo: 'ajuste', ref_id: '', creado: nowISO() };

      };
    }
  });
}

    ${F.field('¿A qué cuenta entró?', F.cuentas('k-cuenta', pref, { cur: s.moneda || 'PEN' }))}${F.field('Fecha en que te pagó', F.date('k-fecha', hoy()))}
    <div class="hint">Se sumará a tu cuenta y quedará como ingreso en “Servicios cobrados”.</div>`,
    foot: '<button class="btn-x" data-save><i class="bi bi-check2-circle"></i> Marcar como cobrado</button>',
    onMount: sh => {
      bindDateChips(sh);
      sh.$('[data-save]').onclick = () => {
        const cuenta = val(sh, 'k-cuenta'), fecha = val(sh, 'k-fecha') || hoy();
        const mv = { id: 'm1_' + id, fecha, tipo: 'ingreso', cuenta_id: cuenta, cuenta_destino_id: '', monto: s.monto, monto_destino: '', categoria_id: catBy('i_servicios') ? 'i_servicios' : (catDefault('ingreso')?.id || ''), nota: `${s.servicio} · ${s.cliente}`, ref_tipo: 'servicio', ref_id: id, creado: nowISO() };
        localStorage.setItem('fin_lastcuenta', cuenta);
        sh.close(); commit([up('Servicios', { id, estado: 'cobrado', fecha_cobro: fecha, cuenta_id: cuenta }), up('Movimientos', mv)], '¡Cobro registrado! 💸');
      };
    }
  });
}
function sheetServDet(id) {
  const s = S.data.servicios.find(x => x.id === id); if (!s) return;
  const cob = s.estado === 'cobrado', dias = s.fecha_estimada ? diffDays(s.fecha_estimada, hoy()) : null;
  openSheet({
    title: esc(s.cliente),
    html: `<div style="text-align:center;margin:2px 0 16px">${avatar(s.cliente, 56)}<div class="fw7" style="margin-top:8px">${esc(s.servicio)}</div><div class="big-num amt ${cob ? 'inc' : 'tr'}" style="margin-top:6px">${money(s.monto, s.moneda)}</div>
      <div style="margin-top:8px">${cob ? `<span class="pill ok"><i class="bi bi-check2-circle"></i> Cobrado el ${fechaCorta(s.fecha_cobro)}</span>` : vencBadge(dias, false)}</div></div>
      <div class="timeline"><div class="tl"><span class="ico sm" style="--c:var(--tr)"><i class="bi bi-briefcase"></i></span><div class="mid"><div class="t">Servicio realizado</div><div class="s">${fechaLarga(s.fecha_servicio)}</div></div></div>
      ${s.fecha_estimada ? `<div class="tl"><span class="ico sm" style="--c:var(--loan)"><i class="bi bi-calendar-event"></i></span><div class="mid"><div class="t">Pago esperado</div><div class="s">${fechaLarga(s.fecha_estimada)}</div></div></div>` : ''}
      ${cob ? `<div class="tl"><span class="ico sm" style="--c:var(--inc)"><i class="bi bi-cash-coin"></i></span><div class="mid"><div class="t">Cobrado</div><div class="s">${fechaLarga(s.fecha_cobro)} · ${esc(cuentaBy(s.cuenta_id)?.nombre || '—')}</div></div></div>` : ''}</div>
      ${s.nota ? `<div class="hint" style="margin-top:12px">📝 ${esc(s.nota)}</div>` : ''}`,
    foot: `<button class="btn-x danger fit" data-a="del" aria-label="Eliminar"><i class="bi bi-trash3"></i></button><button class="btn-x line" data-a="edit"><i class="bi bi-pencil"></i> Editar</button>${cob ? '<button class="btn-x soft" data-a="undo">Deshacer cobro</button>' : '<button class="btn-x" data-a="cobrar">Cobrar</button>'}`,
    onMount: sh => {
      sh.$('[data-a=edit]').onclick = () => { sh.close(); sheetServicio({ id }); };
      sh.$('[data-a=del]').onclick = () => { sh.close(); borrarServicio(id); };
      const c = sh.$('[data-a=cobrar]'); if (c) c.onclick = () => { sh.close(); sheetCobrar(id); };
      const u = sh.$('[data-a=undo]'); if (u) u.onclick = async () => { if (await confirmBox({ title: 'Deshacer cobro', msg: 'Se quitará el ingreso y el servicio volverá a pendiente.', ok: 'Deshacer' })) { sh.close(); commit([up('Servicios', { id, estado: 'pendiente', fecha_cobro: '', cuenta_id: '' }), delWhere('Movimientos', 'ref_id', id)], 'Cobro deshecho'); } };
    }
  });
}

/* ===================== GRUPOS Y CATEGORÍAS ===================== */
function sheetGrupo(opts = {}) {
  const ed = opts.id ? grupoBy(opts.id) : null; let ico = ed?.icono || '🏦', tipo = ed?.tipo || 'normal';
  openSheet({
    title: ed ? 'Editar grupo' : 'Nuevo grupo',
    html: `${F.field('Nombre', F.text('g-nombre', ed?.nombre || '', 'Ej. Ahorros de alto rendimiento'))}
    ${F.field('Tipo', `<div class="seg"><button type="button" data-t="normal" class="${tipo === 'normal' ? 'on' : ''}">Normal</button><button type="button" data-t="ahorro" class="${tipo === 'ahorro' ? 'on' : ''}">Ahorro</button><button type="button" data-t="credito" class="${tipo === 'credito' ? 'on' : ''}">Crédito</button></div>`, 'Crédito = tarjetas (muestran “saldo a pagar”). Ahorro = suma en “Ahorros”.')}
    ${F.field('Icono', `<div class="emoji-grid">${['🏦', '💵', '💳', '🐷', '👜', '🏠', '🚗', '🎓', '✈️', '📈', '💰', '🪙'].map(e => `<button type="button" data-e="${e}" class="${e === ico ? 'on' : ''}">${e}</button>`).join('')}</div>`)}`,
    foot: `${ed ? '<button class="btn-x danger fit" data-del aria-label="Eliminar"><i class="bi bi-trash3"></i></button>' : ''}<button class="btn-x" data-save>Guardar</button>`,
    onMount: sh => {
      sh.$$('[data-t]').forEach(b => b.onclick = () => { tipo = b.dataset.t; sh.$$('[data-t]').forEach(x => x.classList.toggle('on', x === b)); });
      sh.$$('[data-e]').forEach(b => b.onclick = () => { ico = b.dataset.e; sh.$$('[data-e]').forEach(x => x.classList.toggle('on', x === b)); });
      sh.$('[data-save]').onclick = () => {
        const nombre = val(sh, 'g-nombre'); if (!nombre) return toast('Ponle un nombre', 'danger');
        sh.close(); commit([up('Grupos', { id: ed?.id || uid('g_'), nombre, icono: ico, tipo, orden: ed?.orden || S.data.grupos.length + 1 })], 'Grupo guardado');
      };
      const d = sh.$('[data-del]'); if (d) d.onclick = async () => {
        if (S.data.cuentas.some(c => c.grupo_id === ed.id)) return toast('Mueve o elimina primero las cuentas de este grupo', 'danger');
        if (await confirmBox({ title: 'Eliminar grupo', msg: 'Se eliminará este grupo vacío.', ok: 'Eliminar', danger: true })) { sh.close(); commit([del('Grupos', ed.id)], 'Grupo eliminado'); }
      };
    }
  });
}

function sheetCategoria(opts = {}) {
  const ed = opts.id ? catBy(opts.id) : null; let tipo = ed?.tipo || opts.tipo || S.setTab || 'gasto', ico = ed?.icono || '🏷️', color = ed?.color || PALETA[S.data.categorias.length % PALETA.length];
  const sys = ed && SISTEMA.includes(ed.id);
  openSheet({
    title: ed ? 'Editar categoría' : 'Nueva categoría',
    html: `${F.field('Nombre', F.text('k-nombre', ed?.nombre || '', 'Ej. Gimnasio'))}
    ${ed ? '' : `<div class="seg" style="margin-bottom:16px"><button type="button" data-t="gasto" class="${tipo === 'gasto' ? 'on' : ''}">Gasto</button><button type="button" data-t="ingreso" class="${tipo === 'ingreso' ? 'on' : ''}">Ingreso</button></div>`}
    ${F.field('Icono (elige o escribe un emoji)', `<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><input id="k-ico" class="form-control" style="width:76px;text-align:center;font-size:1.4rem!important" value="${esc(ico)}" maxlength="4"></div><div class="emoji-grid">${EMOJIS.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('')}</div>`)}
    ${F.field('Color', `<div class="swatches">${PALETA.map(c => `<button type="button" data-c="${c}" class="${c === color ? 'on' : ''}" style="--c:${c}"></button>`).join('')}</div>`)}`,
    foot: `${ed && !sys ? '<button class="btn-x danger fit" data-del aria-label="Eliminar"><i class="bi bi-trash3"></i></button>' : ''}<button class="btn-x" data-save>Guardar</button>`,
    onMount: sh => {
      sh.$$('[data-t]').forEach(b => b.onclick = () => { tipo = b.dataset.t; sh.$$('[data-t]').forEach(x => x.classList.toggle('on', x === b)); });
      sh.$$('[data-e]').forEach(b => b.onclick = () => { ico = b.dataset.e; sh.$('#k-ico').value = ico; });
      sh.$$('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; sh.$$('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
      if (!ed) setTimeout(() => sh.$('#k-nombre')?.focus(), 380);
      sh.$('[data-save]').onclick = () => {
        const nombre = val(sh, 'k-nombre'); if (!nombre) { toast('Ponle un nombre', 'danger'); return sh.$('#k-nombre').focus(); }
        const c = { id: ed?.id || uid('cat_'), tipo, nombre, icono: val(sh, 'k-ico') || '🏷️', color, orden: ed?.orden || (catsTipo(tipo).length + 1) };
        sh.close(); commit([up('Categorias', c)], 'Categoría guardada'); opts.onSaved && opts.onSaved(c.id);
      };
      const d = sh.$('[data-del]'); if (d) d.onclick = async () => {
        const usos = S.data.movimientos.filter(m => m.categoria_id === ed.id);
        const msg = usos.length ? `Tiene ${usos.length} movimiento${usos.length > 1 ? 's' : ''}; pasarán a “${esc(catDefault(ed.tipo)?.nombre || 'Otros')}”.` : 'Se eliminará esta categoría.';
        if (await confirmBox({ title: 'Eliminar categoría', msg, ok: 'Eliminar', danger: true })) {
          const dest = catDefault(ed.tipo)?.id || '';
          sh.close(); commit([...usos.map(m => up('Movimientos', { id: m.id, categoria_id: dest })), del('Categorias', ed.id)], 'Categoría eliminada');
        }
      };
    }
  });
}

/* =====================================================================
   MIS FINANZAS · arranque, navegación y acciones
   ===================================================================== */
const NAV = [['inicio', 'house-door', 'Inicio'], ['diario', 'journal-text', 'Diario'], ['cuentas', 'wallet2', 'Cuentas'], ['prestamos', 'people', 'Préstamos'], ['servicios', 'briefcase', 'Servicios']];
const TITULOS = { inicio: 'Hola 👋', diario: 'Diario', cuentas: 'Cuentas', prestamos: 'Préstamos', servicios: 'Servicios', ajustes: 'Ajustes' };
const VISTAS = { inicio: vInicio, diario: vDiario, cuentas: vCuentas, prestamos: vPrestamos, servicios: vServicios, ajustes: vAjustes };

function renderChrome() {
  $$('.nav-i').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  $('#title').textContent = TITULOS[S.view];
  $('#subtitle').textContent = S.view === 'inicio' ? cap(fechaLarga(hoy()).replace(/ \d{4}$/, '')) : ({ diario: 'Tus ingresos y gastos', cuentas: 'Dónde está tu dinero', prestamos: 'Quién te debe y a quién debes', servicios: 'Lo que tienes por cobrar', ajustes: 'Personaliza tu app' }[S.view]);
  $('#fab').hidden = S.view === 'ajustes';
  $('#fab').setAttribute('aria-label', S.view === 'prestamos' ? 'Nuevo préstamo' : S.view === 'servicios' ? 'Nuevo servicio' : 'Nuevo movimiento');
  document.body.classList.toggle('hide', localStorage.getItem('fin_hide') === '1');
  const eye = $('#btn-hide i'); if (eye) eye.className = 'bi bi-eye' + (document.body.classList.contains('hide') ? '-slash' : '');
}
function renderAll() {
  if (!S.cargado) return;
  renderChrome();
  $('#view').innerHTML = VISTAS[S.view]();
  if (S.view === 'inicio') requestAnimationFrame(chartsInicio); else killCharts();
}
function setView(v) {
  S.view = v; killCharts();
  const el = $('#view'); el.classList.remove('view'); void el.offsetWidth; el.classList.add('view');
  renderAll(); window.scrollTo({ top: 0 });
}

/* ---------- acciones ---------- */
Object.assign(ACT, {
  go: el => { if (el.dataset.t) S.prestTab = el.dataset.t; setView(el.dataset.v); },
  nav: el => setView(el.dataset.v),
  mes: el => { S.mes = addMonth(S.mes, Number(el.dataset.d)); renderAll(); },
  mesHoy: () => { S.mes = ym(hoy()); renderAll(); },
  filtro: el => { S.filtro = el.dataset.v; renderAll(); },
  verCat: el => { S.cat = el.dataset.id; S.filtro = 'gasto'; S.q = ''; setView('diario'); },
  clearCat: () => { S.cat = ''; renderAll(); },
  cuentasTab: el => { S.cuentasTab = el.dataset.v; renderAll(); },
  goRend: () => { S.cuentasTab = 'rend'; setView('cuentas'); },
  prestTab: el => { S.prestTab = el.dataset.v; renderAll(); },
  prestEstado: el => { S.prestEstado = el.dataset.v; renderAll(); },
  servTab: el => { S.servTab = el.dataset.v; renderAll(); },
  setTab: el => { S.setTab = el.dataset.v; renderAll(); },
  tema: el => { localStorage.setItem('fin_theme', el.dataset.v); aplicarTema(); renderAll(); },
  toggleGrupo: el => { S.collapsed[el.dataset.id] = !S.collapsed[el.dataset.id]; renderAll(); },
  hide: () => { localStorage.setItem('fin_hide', document.body.classList.contains('hide') ? '0' : '1'); renderAll(); },
  fab: () => { if (S.view === 'prestamos') sheetPrestamo(); else if (S.view === 'servicios') sheetServicio(); else sheetMov(); },
  editMov: el => sheetMov({ id: el.dataset.id }),
  newCuenta: el => sheetCuenta({ grupo: el.dataset.g }),
  cuentaDet: el => sheetCuentaDet(el.dataset.id),
  regInteres: el => sheetInteres(el.dataset.id),
  newPrest: () => sheetPrestamo(),
  prestDet: el => sheetPrestDet(el.dataset.id),
  abonar: el => sheetAbono(el.dataset.id),
  newServ: () => sheetServicio(),
  servDet: el => sheetServDet(el.dataset.id),
  cobrar: el => sheetCobrar(el.dataset.id),
  newCat: () => sheetCategoria({ tipo: S.setTab }),
  editCat: el => sheetCategoria({ id: el.dataset.id }),
  newGrupo: () => sheetGrupo(),
  editGrupo: el => sheetGrupo({ id: el.dataset.id }),
  export: el => exportar(el.dataset.v),
  refresh: async () => {
    setSync('saving');
    try { await cargar(); renderAll(); setSync('ok'); toast('Datos actualizados'); } catch (e) { setSync('error'); toast('No se pudo actualizar', 'danger'); }
  },
  logout: () => logout()
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const l = $('#mov-list'); if (l) l.innerHTML = listaMovs(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.cargado && !_pending && !sheetStack.length && Date.now() - S.lastLoad > 90000)
    cargar().then(renderAll).catch(() => { });
});

/* ---------- sesión (usuario y contraseña) ---------- */
let loginBusy = false;
const storedTok = () => localStorage.getItem('fin_tok') || sessionStorage.getItem('fin_tok') || '';
function lockMsg(t, ok = false) { const m = $('#lock-msg'); m.textContent = t; m.style.color = ok ? '#fff' : ''; }
function setLoginBtn(busy) { const b = $('#l-go'); b.disabled = busy; b.textContent = busy ? 'Entrando…' : 'Entrar'; }
function showLock(msg = '') { $('#lock').hidden = false; $('#app').hidden = true; lockMsg(msg); setLoginBtn(false); }
function abrirApp() { $('#lock').hidden = true; $('#app').hidden = false; S.view = 'inicio'; setView('inicio'); }
function limpiarSesion() { localStorage.removeItem('fin_tok'); sessionStorage.removeItem('fin_tok'); S.token = ''; }
function logout() {
  if (S.token) callApi('logout').catch(() => { });
  limpiarSesion(); S.cargado = false; S.data = { grupos: [], cuentas: [], categorias: [], movimientos: [], prestamos: [], servicios: [] };
  sheetStack.slice().forEach(s => s.close()); $('#l-clave').value = ''; showLock();
}
function errorLogin(e, auto) {
  const r = e.res || {};
  if (r.error === 'CREDENCIALES_INCORRECTAS') { const c = $('#lock-form'); c.classList.add('shake'); setTimeout(() => c.classList.remove('shake'), 500); $('#l-clave').value = ''; showLock(`Usuario o contraseña incorrectos${r.restantes != null ? ` · te quedan ${r.restantes} intentos` : ''}`); }
  else if (r.error === 'BLOQUEADO') showLock('Demasiados intentos. Espera 15 minutos.');
  else if (r.error === 'NO_AUTORIZADO') { limpiarSesion(); showLock(auto ? 'Tu sesión expiró. Vuelve a iniciar sesión.' : ''); }
  else if (r.error === 'SIN_API_URL') showLock('Falta pegar la URL del Apps Script en API_URL (index.html).');
  else showLock('No se pudo conectar. Revisa tu internet o la URL del Apps Script.');
}
async function login(usuario, clave, recordar) {
  if (loginBusy) return; loginBusy = true; setLoginBtn(true); lockMsg('');
  try {
    const r = await callApi('login', { usuario, clave, recordar });
    if (!r || !r.ok) { const e = new Error((r && r.error) || 'ERROR'); e.res = r; throw e; }
    S.token = r.token; await cargar();
    (recordar ? localStorage : sessionStorage).setItem('fin_tok', S.token); (recordar ? sessionStorage : localStorage).removeItem('fin_tok');
    localStorage.setItem('fin_user', usuario); $('#l-clave').value = ''; abrirApp();
  } catch (e) { S.token = ''; errorLogin(e, false); }
  loginBusy = false; setLoginBtn(false);
}
function initLock() {
  $('#l-user').value = localStorage.getItem('fin_user') || '';
  $('#lock-form').addEventListener('submit', e => {
    e.preventDefault(); const u = $('#l-user').value.trim(), c = $('#l-clave').value;
    if (!u || !c) return lockMsg('Escribe tu usuario y contraseña');
    login(u, c, $('#remember').checked);
  });
  $('#l-eye').addEventListener('click', () => {
    const i = $('#l-clave'), show = i.type === 'password'; i.type = show ? 'text' : 'password';
    $('#l-eye i').className = 'bi bi-eye' + (show ? '-slash' : '');
  });
}

/* ---------- arranque ---------- */
function boot() {
  aplicarTema(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { aplicarTema(); renderAll(); });
  $('#dock-items').innerHTML = NAV.map(([v, i, t]) => `<button class="nav-i" data-v="${v}" data-act="nav"><i class="bi bi-${i}"></i><span>${t}</span></button>`).join('')
    + `<button class="nav-i side-extra" data-v="ajustes" data-act="nav"><i class="bi bi-gear"></i><span>Ajustes</span></button>`;
  initLock();
  const t = storedTok();
  if (t) {
    S.token = t; $('#lock').hidden = false; lockMsg('Entrando…', true); setLoginBtn(true);
    cargar().then(abrirApp).catch(e => { S.token = ''; errorLogin(e, true); });
  } else showLock();
}
boot();


</script>
